<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Clínica Dentária Professor Doutor João Fontes Pereira
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <img 
            src="https://i.imgur.com/8Km9tLL.png"
            class="logo"
        >

        <h1>
            Clínica Dentária
        </h1>

        <h2>
            Professor Doutor João Fontes Pereira
        </h2>

        <p>
            Sistema de Gestão Horária
        </p>

        <div class="login-box">

            <label>
                Utilizador
            </label>

            <select id="utilizador">

                <option>
                    João Fontes Pereira
                </option>

                <option>
                    Tânia Leite
                </option>

                <option>
                    Daniela Teixeira
                </option>

            </select>

            <label>
                PIN
            </label>

            <input 
                type="password" 
                id="pin"
                placeholder="Introduz o PIN"
            >

            <button onclick="login()">

                Entrar

            </button>

        </div>

    </div>

<script src="script.js"></script>

</body>

</html>
