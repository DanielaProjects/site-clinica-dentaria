        </select>

        <input type="time">

        <input type="time">

        <input type="time">

        <hr>

        <h3>
            Sexta-feira
        </h3>

        <input type="time">

        <input type="time">

        <input type="time">

        <input type="time">

        <hr>

        <h3>
            Sábado
        </h3>

        <label>
            Trabalhou?
        </label>

        <select>

            <option>
                Não
            </option>

            <option>
                Sim
            </option>

        </select>

        <label>
            Hora de Saída
        </label>

        <input type="time">

        <button>

            Guardar Configuração

        </button>

    </div>

</div>

</html>
