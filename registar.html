<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Registar Horário
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="dashboard-container">

    <div class="dashboard-header">

        <img 
            src="logo.png?v=12"
            class="dashboard-logo"
            alt="Logo"
        >

        <div>

            <h1>
                Registar Horário
            </h1>

            <p>
                Inserção diária de horários
            </p>

        </div>

    </div>

    <div class="login-box">

        <label>
            Funcionária
        </label>

        <select>

            <option>
                Daniela Teixeira
            </option>

            <option>
                Tânia Leite
            </option>

        </select>

        <label>
            Data
        </label>

        <input type="date">

        <hr>

        <h3>
            Manhã
        </h3>

        <label>
            Entrada
        </label>

        <input type="time">

        <label>
            Saída
        </label>

        <input type="time">

        <hr>

        <h3>
            Tarde
        </h3>

        <label>
            Entrada
        </label>

        <input type="time">

        <label>
            Saída
        </label>

        <input type="time">

        <hr>

        <label>
            Feriado?
        </label>

        <select>

            <option>
                Não
            </option>

            <option>
                Sim
            </option>

        </select>

        <label>
            Observações
        </label>

        <input 
            type="text"
            placeholder="Ex: Consulta, atraso, saída antecipada..."
        >

        <button>

            Guardar Horário

        </button>

    </div>

</div>

</body>

</html>
